services:
  postgres:
    image: postgres:16
    container_name: smartoffer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SmartOfferSlotDB
    volumes:
      - ./docker-data:/var/lib/postgresql/data
